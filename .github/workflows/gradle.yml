name: FOSS Android CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    name: FOSS Android build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-foss-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-foss-
            ${{ runner.os }}-gradle-

      - name: Configure Android SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Configure Gradle resources
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=2
          EOF

      - name: Verify repository formatting
        run: git diff --check

      - name: Build and test the FOSS reference variant
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:compileUniversalFossDebugKotlin \
            :app:testUniversalFossDebugUnitTest \
            :betterlyrics:testDebugUnitTest \
            :unison:test \
            :wear:testDebugUnitTest \
            :innertube:testDebugUnitTest \
            :letras:test \
            :canvas:test \
            :app:lintUniversalFossDebug \
            :app:assembleUniversalFossDebug \
            --no-daemon

  worker:
    name: Attribution Worker typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/youtube-attribution
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: workers/youtube-attribution/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck Worker
        run: npm run typecheck
